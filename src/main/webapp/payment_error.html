<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .error-card {
            background: rgba(30, 41, 59, 0.7);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        .icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin-bottom: 1rem;
            color: #ef4444;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .btn {
            background: #334155;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
        }

        .btn:hover {
            background: #475569;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="icon"><i class="fas fa-times-circle"></i></div>
        <h1>Payment Failed</h1>
        <p id="errorMessage">Sorry, we couldn't process your payment. Please try again later.</p>
        <a href="user_dashboard.html" class="btn">Return to Dashboard</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('msg')) {
            document.getElementById('errorMessage').textContent = params.get('msg');
        }
    </script>
</body>

</html>
