<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Dashboard - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .guest-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .welcome-card {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 3rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .res-card {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="guest-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2><i class="fas fa-umbrella-beach"></i> Ocean View Resort</h2>
            <button class="btn btn-outline" id="logoutBtn">Logout</button>
        </header>

        <div class="welcome-card">
            <h1>Welcome back!</h1>
            <p>Your paradise awaits. Check your current bookings below.</p>
        </div>

        <div id="reservationsList">
            <h3>My Reservations</h3>
            <!-- Dynamic loading -->
            <p>Loading your bookings...</p>
        </div>
    </div>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('api/auth/logout');
            window.location.href = 'guest_login.html';
        });

        // Simple demo: fetch reservations for "me" (backend should filter by session)
        async function loadMyReservations() {
            try {
                const resp = await fetch('api/reservations'); // For now fetch all, real app would filter
                const data = await resp.json();
                const list = data.data || [];

                const container = document.getElementById('reservationsList');
                if (list.length === 0) {
                    container.innerHTML = '<p>No reservations found.</p>';
                    return;
                }

                container.innerHTML = '<h3>My Reservations</h3>' + list.map(r => `
                    <div class="res-card">
                        <div>
                            <strong>${r.reservationNumber}</strong><br>
                            <small>Room ID: ${r.roomId}</small>
                        </div>
                        <div>
                            <span>${r.checkInDate} to ${r.checkOutDate}</span>
                        </div>
                        <div>
                            <span class="status-badge status-${r.status.toLowerCase()}">${r.status}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('reservationsList').innerHTML = '<p>Error loading bookings.</p>';
            }
        }
        loadMyReservations();
    </script>
</body>

</html>
