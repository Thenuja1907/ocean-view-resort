<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Ocean View Resort</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .error-card {
            padding: 4rem;
            max-width: 500px;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            color: var(--primary);
            line-height: 1;
        }

        h2 {
            font-size: 1.8rem;
            margin: 1.5rem 0;
            color: white;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="glass-card error-card">
        <h1>:(</h1>
        <h2>Operation Interrupted</h2>
        <p>We encountered an unexpected wave. Please refresh your journey or return home.</p>
        <a href="index.html" class="btn btn-primary" style="text-decoration: none;">Navigate Home</a>
    </div>
</body>

</html>
