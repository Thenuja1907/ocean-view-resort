<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal Login - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-yellow: #fcc419;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --modal-bg: rgba(20, 20, 20, 0.95);
            --text-white: #ffffff;
            --dark-input: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 3.5rem 2.5rem;
            width: 100%;
            max-width: 440px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        .logo-container i {
            font-size: 2.2rem;
            color: var(--primary-yellow);
        }

        .logo-container span {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--primary-yellow);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-white);
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 3rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.8rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-white);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--dark-input);
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        input:focus {
            border-color: var(--primary-yellow);
            background: rgba(255, 255, 255, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 1.1rem;
            border: none;
            border-radius: 12px;
            background: var(--primary-yellow);
            color: #1a1a1a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(252, 196, 25, 0.3);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        /* Registration Modal Matching First Pic Theme */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(25, 25, 25, 0.8);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            width: 100%;
            max-width: 600px;
            border-radius: 28px;
            padding: 3rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 60px 100px rgba(0, 0, 0, 0.7);
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            opacity: 0.4;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        .full-w {
            grid-column: span 2;
        }

        .modal-title {
            color: var(--primary-yellow);
            letter-spacing: 3px;
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-container">
            <i class="fas fa-umbrella-beach"></i>
            <span>Ocean View</span>
        </div>
        <div class="subtitle">USER PORTAL</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter registration email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
            <div class="error-msg" id="loginError">Invalid credentials.</div>
        </form>

        <div class="footer">
            Don't have an account? <a href="#" id="openRegister"
                style="color: var(--primary-yellow); text-decoration: none; font-weight: 500;">Register Now</a><br><br>
            &copy; 2026 Ocean View Resort Management System
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-btn" id="closeRegister">&times;</span>
            <div class="modal-title">GUEST REGISTRATION</div>

            <form id="registerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="regFirst" placeholder="Enter first name" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="regLast" placeholder="Enter last name" required>
                    </div>
                    <div class="form-group full-w">
                        <label>Email Address</label>
                        <input type="email" id="regEmail" placeholder="Example: manivannanthenuja@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPass" placeholder="Create password" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="regPhone" placeholder="Example: 0712345678" required>
                    </div>
                    <div class="form-group full-w">
                        <label>Address</label>
                        <input type="text" id="regAddr" placeholder="Street Address" required>
                    </div>
                    <div class="form-group">
                        <label>ID Type</label>
                        <select id="regIdType" style="padding-left: 1rem;">
                            <option value="NIC">NIC</option>
                            <option value="PASSPORT">Passport</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ID Number</label>
                        <input type="text" id="regIdNum" placeholder="1999258338896" required>
                    </div>
                </div>
                <button type="submit" class="login-btn">Create Account</button>
                <div class="error-msg" id="regError"></div>
            </form>
        </div>
    </div>

    <script>
        const regModal = document.getElementById('registerModal');
        const openBtn = document.getElementById('openRegister');
        const closeBtn = document.getElementById('closeRegister');

        openBtn.onclick = (e) => { e.preventDefault(); regModal.classList.add('active'); };
        closeBtn.onclick = () => { regModal.classList.remove('active'); };

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('api/auth/guest-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = 'user_dashboard.html';
                } else {
                    if (data.message && data.message.includes('not found')) {
                        errorMsg.innerHTML = `${data.message} <br> <a href="#" onclick="document.getElementById('openRegister').click()" style="color: var(--primary-yellow); text-decoration: underline;">Click here to register</a>`;
                    } else {
                        errorMsg.textContent = data.message || 'Login failed.';
                    }
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server connection failed.';
                errorMsg.style.display = 'block';
            }
        });

        // Handle Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('regError');
            errorMsg.style.display = 'none';

            const formData = new URLSearchParams();
            formData.append('firstName', document.getElementById('regFirst').value);
            formData.append('lastName', document.getElementById('regLast').value);
            formData.append('email', document.getElementById('regEmail').value);
            formData.append('password', document.getElementById('regPass').value);
            formData.append('contactNumber', document.getElementById('regPhone').value);
            formData.append('address', document.getElementById('regAddr').value);
            formData.append('idType', document.getElementById('regIdType').value);
            formData.append('idNumber', document.getElementById('regIdNum').value);
            formData.append('nationality', 'Resident');

            try {
                const response = await fetch('api/guests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    alert('Registration Successful! Redirecting to Portal Selection.');
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Registration failed.';
                errorMsg.style.display = 'block';
            }
        });

        if (window.location.search.includes('register')) regModal.classList.add('active');
    </script>
</body>

</html>
