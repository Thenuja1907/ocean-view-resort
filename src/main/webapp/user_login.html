<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal Login - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #004e92;
            --secondary-deep: #000428;
            --accent-yellow: #f1c40f;
            --text-dark: #2c3e50;
            --bg-light: #f4f7f6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--secondary-deep) 0%, var(--primary-blue) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-card {
            background: white;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 0.5rem;
            color: var(--secondary-deep);
        }

        .logo-container i {
            font-size: 2rem;
            color: var(--accent-yellow);
        }

        .logo-container span {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #7f8c8d;
            letter-spacing: 2px;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #bdc3c7;
        }

        input,
        select {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background: #f9f9f9;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-blue);
            background: white;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 10px;
            background: var(--secondary-deep);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: var(--primary-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .register-link {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        .register-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: none;
        }

        /* Modal styling */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .full-w {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-container">
            <i class="fas fa-umbrella-beach"></i>
            <span>Ocean View</span>
        </div>
        <div class="subtitle">User Guest Portal</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
            <div class="error-msg" id="loginError">Invalid credentials.</div>
        </form>

        <div class="register-link">
            Don't have an account? <a href="#" id="openRegister">Join Now</a>
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: var(--secondary-deep);">Start Your Journey</h2>
            <p style="color: #7f8c8d; font-size: 0.9rem; margin-bottom: 2rem;">Register for an exclusive resort
                experience.</p>

            <form id="registerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="regFirst" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="regLast" required>
                    </div>
                    <div class="form-group full-w">
                        <label>Email Address</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPass" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" id="regPhone" required>
                    </div>
                    <div class="form-group full-w">
                        <label>Home Address</label>
                        <input type="text" id="regAddr" required>
                    </div>
                    <div class="form-group">
                        <label>ID Type</label>
                        <select id="regIdType">
                            <option value="NIC">NIC</option>
                            <option value="PASSPORT">Passport</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ID Number</label>
                        <input type="text" id="regIdNum" required>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 1rem;">
                    <button type="button" class="login-btn" style="background:#bdc3c7;"
                        onclick="document.getElementById('registerModal').classList.remove('active')">Cancel</button>
                    <button type="submit" class="login-btn">Create Account</button>
                </div>
                <div class="error-msg" id="regError"></div>
            </form>
        </div>
    </div>

    <script>
        const regModal = document.getElementById('registerModal');
        const openBtn = document.getElementById('openRegister');

        openBtn.onclick = (e) => { e.preventDefault(); regModal.classList.add('active'); };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('api/auth/guest-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = 'user_dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Login failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server connection failed.';
                errorMsg.style.display = 'block';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('regError');
            errorMsg.style.display = 'none';

            const formData = new URLSearchParams();
            formData.append('firstName', document.getElementById('regFirst').value);
            formData.append('lastName', document.getElementById('regLast').value);
            formData.append('email', document.getElementById('regEmail').value);
            formData.append('password', document.getElementById('regPass').value);
            formData.append('contactNumber', document.getElementById('regPhone').value);
            formData.append('address', document.getElementById('regAddr').value);
            formData.append('idType', document.getElementById('regIdType').value);
            formData.append('idNumber', document.getElementById('regIdNum').value);
            formData.append('nationality', 'Guest');

            try {
                const response = await fetch('api/guests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    alert('Registration Successful!');
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Registration failed.';
                errorMsg.style.display = 'block';
            }
        });

        if (window.location.search.includes('register')) regModal.classList.add('active');
    </script>
</body>

</html>
