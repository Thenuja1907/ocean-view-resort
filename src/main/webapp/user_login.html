<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Portal - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <!-- Login Panel (Left) -->
        <div class="auth-left">
            <div class="glass-card auth-card">
                <div class="logo-container">
                    <i class="fas fa-umbrella-beach"></i>
                    <span>Ocean View</span>
                </div>
                <h2>Guest Portal</h2>
                <p class="subtitle">Welcome back to paradise</p>

                <form id="loginForm">
                    <div class="form-group">
                        <span class="label-small">Email Address</span>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" placeholder="Enter registration email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <span class="label-small">Password</span>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Enter password" required>
                        </div>
                    </div>
                    <div class="error-msg" id="loginError"></div>
                    <button type="submit" class="btn btn-primary full">Sign In</button>
                </form>

                <div class="footer-text">
                    &copy; 2026 Ocean View Resort Management System
                </div>
            </div>
        </div>

        <!-- Registration Panel (Right) -->
        <div class="auth-right">
            <div class="glass-card auth-card" style="text-align: left;">
                <h2 style="text-align: center;">Guest Registration</h2>
                <p class="subtitle" style="text-align: center;">Join our exclusive resort community</p>

                <form id="registerForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <span class="label-small">First Name</span>
                            <input type="text" id="regFirst" required>
                        </div>
                        <div class="form-group">
                            <span class="label-small">Last Name</span>
                            <input type="text" id="regLast" required>
                        </div>
                        <div class="form-group full-w">
                            <span class="label-small">Email Address</span>
                            <input type="email" id="regEmail" required>
                        </div>
                        <div class="form-group">
                            <span class="label-small">Password</span>
                            <input type="password" id="regPass" required>
                        </div>
                        <div class="form-group">
                            <span class="label-small">Contact Number</span>
                            <input type="text" id="regPhone" required>
                        </div>
                        <div class="form-group full-w">
                            <span class="label-small">Home Address</span>
                            <textarea id="regAddr" required style="height: 60px;"></textarea>
                        </div>
                        <div class="form-group">
                            <span class="label-small">ID Type</span>
                            <select id="regIdType">
                                <option value="NIC">NIC</option>
                                <option value="PASSPORT">Passport</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <span class="label-small">ID Number</span>
                            <input type="text" id="regIdNum" required>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button type="button" class="btn"
                            style="background: rgba(255,255,255,0.1); color: white; flex: 1;"
                            onclick="window.location.href='index.html'">Cancel</button>
                        <button type="submit" class="btn btn-primary" style="flex: 2;">Register & Join</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('api/auth/guest-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = 'user_dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Login failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server connection failed.';
                errorMsg.style.display = 'block';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('firstName', document.getElementById('regFirst').value);
            formData.append('lastName', document.getElementById('regLast').value);
            formData.append('email', document.getElementById('regEmail').value);
            formData.append('password', document.getElementById('regPass').value);
            formData.append('contactNumber', document.getElementById('regPhone').value);
            formData.append('address', document.getElementById('regAddr').value);
            formData.append('idType', document.getElementById('regIdType').value);
            formData.append('idNumber', document.getElementById('regIdNum').value);
            formData.append('nationality', 'Guest');

            try {
                const response = await fetch('api/guests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    alert('Registration Successful! Welcome to Ocean View.');
                    window.location.href = 'user_dashboard.html';
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Registration failed.');
            }
        });
    </script>
</body>

</html>
