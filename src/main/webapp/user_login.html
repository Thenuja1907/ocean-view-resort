<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Portal Login - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Page layout handled by .auth-page in css/style.css */

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 4rem 3rem;
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 0.5rem;
        }

        .logo-container i {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .logo-container span {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-white);
            letter-spacing: 3px;
            opacity: 0.8;
            margin-bottom: 3.5rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-white);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
        }

        input {
            padding-left: 3.5rem !important;
        }

        .register-link {
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            display: none;
        }

        /* Modal specific styling */
        .modal-content {
            padding: 3.5rem 2.5rem;
            color: white;
            max-width: 650px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .full-w {
            grid-column: span 2;
        }
    </style>
</head>

<body class="auth-page">
    <div class="glass-card auth-card login-card">
        <div class="logo-container">
            <i class="fas fa-umbrella-beach"></i>
            <span>Ocean View</span>
        </div>
        <div class="subtitle">GUEST PORTAL</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter registration email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary full-width">Sign In</button>
            <div class="error-msg" id="loginError">Invalid credentials.</div>
        </form>

        <div class="register-link">
            New to Ocean View? <a href="#" id="openRegister">Create an account</a>
        </div>

        <div class="footer-text">
            &copy; 2026 Ocean View Resort Management System
        </div>
    </div>

    <!-- Registration Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: var(--primary); margin-bottom: 2rem;">Guest Registration</h2>

            <form id="registerForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="regFirst" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="regLast" required>
                    </div>
                    <div class="form-group full-w">
                        <label>Email Address</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPass" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" id="regPhone" required>
                    </div>
                    <div class="form-group full-w">
                        <label>Home Address</label>
                        <textarea id="regAddr" required style="height: 80px;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>ID Type</label>
                        <select id="regIdType">
                            <option value="NIC">NIC</option>
                            <option value="PASSPORT">Passport</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ID Number</label>
                        <input type="text" id="regIdNum" required>
                    </div>
                </div>
                <div style="display: flex; gap: 15px; margin-top: 2rem;">
                    <button type="button" class="btn" style="background: rgba(255,255,255,0.1); color: white; flex: 1;"
                        onclick="document.getElementById('registerModal').classList.remove('active')">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 2;">Register & Join</button>
                </div>
                <div class="error-msg" id="regError"></div>
            </form>
        </div>
    </div>

    <script>
        const regModal = document.getElementById('registerModal');
        const openBtn = document.getElementById('openRegister');

        openBtn.onclick = (e) => { e.preventDefault(); regModal.classList.add('active'); };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('api/auth/guest-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = 'user_dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Login failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server connection failed.';
                errorMsg.style.display = 'block';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('regError');
            errorMsg.style.display = 'none';

            const formData = new URLSearchParams();
            formData.append('firstName', document.getElementById('regFirst').value);
            formData.append('lastName', document.getElementById('regLast').value);
            formData.append('email', document.getElementById('regEmail').value);
            formData.append('password', document.getElementById('regPass').value);
            formData.append('contactNumber', document.getElementById('regPhone').value);
            formData.append('address', document.getElementById('regAddr').value);
            formData.append('idType', document.getElementById('regIdType').value);
            formData.append('idNumber', document.getElementById('regIdNum').value);
            formData.append('nationality', 'Guest');

            try {
                const response = await fetch('api/guests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    alert('Registration Successful! Welcome to Ocean View.');
                    window.location.href = 'user_login.html';
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Registration failed.';
                errorMsg.style.display = 'block';
            }
        });

        if (window.location.search.includes('register')) regModal.classList.add('active');
    </script>
</body>

</html>
