<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .gateway-card {
            width: 100%;
            max-width: 600px;
            padding: 5rem 3rem;
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 1rem;
        }

        .logo-container i {
            font-size: 4rem;
            color: var(--primary);
        }

        .logo-container span {
            font-size: 4rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-white);
            letter-spacing: 5px;
            opacity: 0.9;
            margin-bottom: 5rem;
            text-transform: uppercase;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
        }

        .portal-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .portal-btn i {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .portal-btn span {
            font-weight: 500;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
        }

        .portal-btn:hover {
            transform: translateY(-12px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .footer-text {
            margin-top: 5rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body>
    <div class="glass-card gateway-card">
        <div class="logo-container">
            <i class="fas fa-umbrella-beach"></i>
            <span>Ocean View</span>
        </div>
        <div class="subtitle">PREMIUM RESORT EXPERIENCE</div>

        <div class="portal-grid">
            <a href="user_login.html" class="portal-btn">
                <i class="fas fa-user-friends"></i>
                <span>GUEST PORTAL</span>
            </a>
            <a href="staff_login.html" class="portal-btn">
                <i class="fas fa-shield-alt"></i>
                <span>STAFF PORTAL</span>
            </a>
        </div>

        <div class="footer-text">
            &copy; 2026 Ocean View Resort Management System
        </div>
    </div>
</body>

</html>
