<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Registration - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            overflow-y: auto;
        }

        .register-card {
            width: 100%;
            max-width: 650px;
            padding: 4rem 3rem;
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 0.5rem;
        }

        .logo-container i {
            font-size: 2.2rem;
            color: var(--primary);
        }

        .logo-container span {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--primary);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-white);
            letter-spacing: 3px;
            opacity: 0.8;
            margin-bottom: 3.5rem;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            text-align: left;
        }

        .full-w {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
        }

        input {
            padding-left: 3rem !important;
        }

        .links {
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            display: none;
        }
    </style>
</head>

<body>
    <div class="glass-card register-card">
        <div class="logo-container">
            <i class="fas fa-umbrella-beach"></i>
            <span>Ocean View</span>
        </div>
        <div class="subtitle">Join Our Elite Membership</div>

        <form id="registerForm">
            <div class="form-grid">
                <div>
                    <label>First Name</label>
                    <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="firstName"
                            placeholder="John" required></div>
                </div>
                <div>
                    <label>Last Name</label>
                    <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="lastName"
                            placeholder="Doe" required></div>
                </div>
                <div class="full-w">
                    <label>Email Address</label>
                    <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="email" required>
                    </div>
                </div>
                <div>
                    <label>Password</label>
                    <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" required>
                    </div>
                </div>
                <div>
                    <label>Contact Number</label>
                    <div class="input-wrapper"><i class="fas fa-phone"></i><input type="text" id="contactNumber"
                            required></div>
                </div>
                <div class="full-w">
                    <label>Residential Address</label>
                    <div class="input-wrapper"><i class="fas fa-map-marker-alt"></i><input type="text" id="address"
                            required></div>
                </div>
                <div>
                    <label>Identity Type</label>
                    <select id="idType" style="padding-left: 1rem;">
                        <option value="NIC">NIC</option>
                        <option value="PASSPORT">Passport</option>
                    </select>
                </div>
                <div>
                    <label>ID Number</label>
                    <div class="input-wrapper"><i class="fas fa-id-card"></i><input type="text" id="idNumber" required>
                    </div>
                </div>
                <div class="full-w">
                    <label>Nationality</label>
                    <div class="input-wrapper"><i class="fas fa-globe"></i><input type="text" id="nationality"
                            placeholder="e.g. Sri Lankan" required></div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2.5rem;">Begin Your
                Journey</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="links">
            Already part of our resort? <a href="user_login.html">Sign In Here</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const formData = new URLSearchParams();
            formData.append('firstName', document.getElementById('firstName').value);
            formData.append('lastName', document.getElementById('lastName').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('contactNumber', document.getElementById('contactNumber').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('idType', document.getElementById('idType').value);
            formData.append('idNumber', document.getElementById('idNumber').value);
            formData.append('nationality', document.getElementById('nationality').value);

            try {
                const response = await fetch('api/guests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    alert('Registration successful! Welcome to Ocean View.');
                    window.location.href = 'user_login.html';
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server connection failed.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
