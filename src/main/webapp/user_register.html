<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Registration - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Page layout handled by .auth-page in css/style.css */

        .register-card {
            width: 100%;
            max-width: 650px;
            padding: 4rem 3rem;
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 0.5rem;
        }

        .logo-container i {
            font-size: 2.2rem;
            color: var(--primary);
        }

        .logo-container span {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--primary);
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-white);
            letter-spacing: 3px;
            opacity: 0.8;
            margin-bottom: 3.5rem;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            text-align: left;
        }

        .full-w {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
        }

        input {
            padding-left: 3rem !important;
        }

        .links {
            margin-top: 2.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            display: none;
        }
    </style>
    </head>

    <body class="auth-page">
        <div class="auth-container">
            <div class="auth-left">
                <div class="glass-card auth-card">
                    <div class="logo-container">
                        <i class="fas fa-umbrella-beach"></i>
                        <span>Ocean View</span>
                    </div>
                    <h2>SIGN IN</h2>
                    <div class="subtitle">GUEST PORTAL</div>

                    <form id="loginFormLeft">
                        <div class="form-group">
                            <label class="label-small">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="loginEmail" placeholder="Enter email" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="label-small">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="loginPass" placeholder="Enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary full">Sign In</button>
                        <div style="height:12px"></div>
                        <div class="links" style="text-align:center; margin-top:0.5rem;">
                            <a href="#" onclick="document.getElementById('regFormRight').scrollIntoView(); return false;" style="color:var(--primary);">Create an account</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="auth-right">
                <div class="glass-card auth-card">
                    <h2>CREATE ACCOUNT</h2>
                    <div class="subtitle">Join Our Elite Membership</div>
                    <form id="regFormRight">
                        <div class="form-grid">
                            <div>
                                <label class="label-small">First Name</label>
                                <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="firstName" placeholder="First name" required></div>
                            </div>
                            <div>
                                <label class="label-small">Last Name</label>
                                <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="lastName" placeholder="Last name" required></div>
                            </div>
                            <div class="full-w">
                                <label class="label-small">Email Address</label>
                                <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Enter email" required></div>
                            </div>
                            <div>
                                <label class="label-small">Phone Number</label>
                                <div class="input-wrapper"><i class="fas fa-phone"></i><input type="text" id="contactNumber" placeholder="Enter phone number" required></div>
                            </div>
                            <div>
                                <label class="label-small">Password</label>
                                <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Create a password" required></div>
                            </div>
                            <div class="full-w">
                                <label class="label-small">Confirm Password</label>
                                <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="confirmPassword" placeholder="Confirm your password" required></div>
                            </div>
                            <div class="full-w">
                                <label class="label-small">Residential Address</label>
                                <div class="input-wrapper"><i class="fas fa-map-marker-alt"></i><input type="text" id="address" placeholder="Address" required></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary full" style="margin-top:1rem;">Create Account</button>
                        <div class="error-msg" id="regErrorRight"></div>
                    </form>

                    <div style="margin-top:1rem; text-align:center; color:rgba(255,255,255,0.6);">Already have an account? <a href="user_login.html" style="color:var(--primary);">Sign in</a></div>
                </div>
            </div>
        </div>

        <script>
            // Left sign-in handler
            document.getElementById('loginFormLeft').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPass').value;
                try {
                    const response = await fetch('api/auth/guest-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                    });
                    const data = await response.json();
                    if (data.success) {
                        window.location.href = 'user_dashboard.html';
                    } else {
                        alert(data.message || 'Login failed.');
                    }
                } catch (err) {
                    alert('Server connection failed.');
                }
            });

            // Right registration handler
            document.getElementById('regFormRight').addEventListener('submit', async (e) => {
                e.preventDefault();
                const err = document.getElementById('regErrorRight');
                err.style.display = 'none';
                const pw = document.getElementById('password').value;
                const cpw = document.getElementById('confirmPassword').value;
                if (pw !== cpw) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

                const formData = new URLSearchParams();
                formData.append('firstName', document.getElementById('firstName').value);
                formData.append('lastName', document.getElementById('lastName').value);
                formData.append('email', document.getElementById('email').value);
                formData.append('password', pw);
                formData.append('contactNumber', document.getElementById('contactNumber').value);
                formData.append('address', document.getElementById('address').value);
                formData.append('idType', 'NIC');
                formData.append('idNumber', '');
                formData.append('nationality', '');

                try {
                    const response = await fetch('api/guests', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('Registration successful!');
                        window.location.href = 'user_login.html';
                    } else {
                        err.textContent = data.message || 'Registration failed.';
                        err.style.display = 'block';
                    }
                } catch (errx) {
                    err.textContent = 'Server connection failed.';
                    err.style.display = 'block';
                }
            });
        </script>
    </body>

</html>
