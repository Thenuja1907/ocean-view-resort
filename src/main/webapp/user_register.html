<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Registration - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-yellow: #fcc419;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem 0;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.4);
            color: white;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        .logo-container i {
            font-size: 2rem;
            color: var(--primary-yellow);
        }

        .logo-container span {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary-yellow);
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
        }

        input,
        select {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-yellow);
            background: rgba(0, 0, 0, 0.4);
        }

        select option {
            background: #222;
            color: white;
        }

        .register-btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: var(--primary-yellow);
            color: #1a1a1a;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .register-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .links a {
            color: var(--primary-yellow);
            text-decoration: none;
            font-weight: 500;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <div class="logo-container">
            <i class="fas fa-umbrella-beach"></i>
            <span>Ocean View</span>
        </div>
        <div class="subtitle">Guest Registration</div>

        <form id="registerForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="firstName" placeholder="John" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="lastName" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-group full">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Create password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="text" id="contactNumber" placeholder="+12345678" required>
                    </div>
                </div>
                <div class="form-group full">
                    <label>Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" id="address" placeholder="123 Resort St" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>ID Type</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <select id="idType" required style="padding-left: 2.8rem;">
                            <option value="NIC">NIC</option>
                            <option value="PASSPORT">Passport</option>
                            <option value="DRIVING_LICENSE">Driving License</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>ID Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-badge"></i>
                        <input type="text" id="idNumber" placeholder="ID Number" required>
                    </div>
                </div>
                <div class="form-group full">
                    <label>Nationality</label>
                    <div class="input-wrapper">
                        <i class="fas fa-globe"></i>
                        <input type="text" id="nationality" placeholder="United Kingdom" required>
                    </div>
                </div>
            </div>
            <button type="submit" class="register-btn">Create Account</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="links">
            Already have an account? <a href="user_login.html">Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const formData = new URLSearchParams();
            formData.append('firstName', document.getElementById('firstName').value);
            formData.append('lastName', document.getElementById('lastName').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('contactNumber', document.getElementById('contactNumber').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('idType', document.getElementById('idType').value);
            formData.append('idNumber', document.getElementById('idNumber').value);
            formData.append('nationality', document.getElementById('nationality').value);

            try {
                // We use the existing guest creation endpoint but now it handles passwords
                const response = await fetch('api/guests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    alert('Registration successful! Please login.');
                    window.location.href = 'user_login.html';
                } else {
                    errorMsg.textContent = data.message || 'Registration failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server connection failed.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
