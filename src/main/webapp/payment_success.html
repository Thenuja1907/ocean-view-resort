<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .success-card {
            background: rgba(30, 41, 59, 0.7);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        .icon {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 1.5rem;
        }

        h1 {
            margin-bottom: 1rem;
            color: #fcc419;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .btn {
            background: #fcc419;
            color: #0f172a;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(252, 196, 25, 0.4);
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="icon"><i class="fas fa-check-circle"></i></div>
        <h1>Payment Successful!</h1>
        <p>Your transaction has been completed. Your reservation is now confirmed.</p>
        <a href="user_dashboard.html" class="btn">Return to Dashboard</a>
    </div>
</body>

</html>
