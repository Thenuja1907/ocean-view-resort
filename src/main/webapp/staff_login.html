<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal Login - Ocean View Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Page layout handled by .auth-page in css/style.css */

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 4rem 3rem;
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 0.5rem;
        }

        .logo-container i {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .logo-container span {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-white);
            letter-spacing: 3px;
            opacity: 0.8;
            margin-bottom: 3.5rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-white);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
        }

        input {
            padding-left: 3.5rem !important;
        }

        .footer-text {
            margin-top: 3.5rem;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            display: none;
        }
    </style>

</head>

<body class="auth-page">
    <div class="glass-card login-card"
        style="max-width: 450px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 3rem;">
        <div class="logo-container"
            style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 0.5rem;">
            <i class="fas fa-umbrella-beach" style="font-size: 2rem; color: #FFC107;"></i>
            <span style="font-size: 1.8rem; font-weight: 700; color: #FFC107; letter-spacing: 0.5px;">Ocean View</span>
        </div>
        <div class="subtitle"
            style="font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); letter-spacing: 2.5px; margin-bottom: 2.5rem; font-weight: 500;">
            STAFF PORTAL</div>

        <form id="loginForm">
            <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
                <label
                    style="display: block; font-size: 0.85rem; font-weight: 400; color: white; margin-bottom: 0.6rem;">Username</label>
                <div class="input-wrapper" style="position: relative;">
                    <i class="fas fa-user"
                        style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 0.9rem;"></i>
                    <input type="text" id="username" placeholder="admin" value="admin" required
                        style="width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white;">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 2rem; text-align: left;">
                <label
                    style="display: block; font-size: 0.85rem; font-weight: 400; color: white; margin-bottom: 0.6rem;">Password</label>
                <div class="input-wrapper" style="position: relative;">
                    <i class="fas fa-lock"
                        style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 0.9rem;"></i>
                    <input type="password" id="password" placeholder="Enter password" required
                        style="width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white;">
                </div>
            </div>
            <div class="error-msg" id="errorMsg"
                style="color: #ff4757; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn btn-primary"
                style="width: 100%; padding: 1rem; background: #FFC107; color: #1a1a1a; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Sign
                In</button>
        </form>

        <div class="footer-text" style="margin-top: 3rem; font-size: 0.7rem; color: rgba(255, 255, 255, 0.3);">
            &copy; 2026 Ocean View Resort Management System
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Login failed.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Server connection failed.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
